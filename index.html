<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jee Digital Image Studio</title>

<style>
body{
    margin:0;
    font-family: 'Georgia', serif;
    background:#0d0d0d;
    color:white;
}

/* HEADER */
header{
    text-align:center;
    padding:40px 20px;
    border-bottom:2px solid gold;
}
header img{
    width:180px;
    filter:drop-shadow(0 0 20px gold);
}
header h1{
    color:gold;
    margin:10px 0;
}
header p{
    color:#ccc;
}

/* HERO */
.hero{
    background:url('photo1.jpg') center/cover no-repeat;
    height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.hero h2{
    background:rgba(0,0,0,0.7);
    padding:20px 30px;
    border:2px solid gold;
    color:gold;
    font-size:28px;
}

/* GALLERY */
.gallery{
    padding:60px 20px;
    text-align:center;
}
.gallery h2{
    color:gold;
    margin-bottom:30px;
}
.gallery-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}
.gallery-container img{
    width:280px;
    border-radius:10px;
    border:2px solid gold;
    transition:0.4s;
}
.gallery-container img:hover{
    transform:scale(1.05);
}

/* REVIEW */
.review-section{
    max-width:750px;
    margin:auto;
    padding:50px 20px;
}
.review-section h2{
    text-align:center;
    color:gold;
}
.review-box{
    background:#1a1a1a;
    padding:25px;
    border-radius:10px;
    border:1px solid gold;
}
input, textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
    border:none;
}
.star{
    font-size:30px;
    cursor:pointer;
    color:gray;
}
.star.selected{
    color:gold;
}
button{
    width:100%;
    padding:12px;
    background:gold;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
.review-card{
    background:#1a1a1a;
    padding:15px;
    margin-top:15px;
    border-left:4px solid gold;
}

/* MAP */
.map-section{
    padding:60px 20px;
    text-align:center;
}
.map-section h2{
    color:gold;
    margin-bottom:20px;
}
iframe{
    border-radius:10px;
    border:2px solid gold;
}

/* CONTACT */
.contact{
    padding:40px;
    text-align:center;
    border-top:2px solid gold;
}
.contact h2{
    color:gold;
}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px;
    border-radius:50%;
    text-decoration:none;
    font-size:22px;
}
</style>
</head>

<body>

<header>
<img src="logo.jpg">
<h1>Jee Digital Image Studio</h1>
<p>Photography • Videography • Wedding Shoots • Albums</p>
</header>

<section class="hero">
<h2>Capturing Your Precious Wedding Moments</h2>
</section>

<section class="gallery">
<h2>Our Wedding Works</h2>
<div class="gallery-container">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
</div>
</section>

<section class="review-section">
<h2>Client Reviews</h2>
<div class="review-box">
<input type="text" id="name" placeholder="Your Name">
<textarea id="comment" placeholder="Write your review"></textarea>

<div>
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<button onclick="submitReview()">Submit Review</button>
</div>

<div id="reviews"></div>
</section>

<section class="map-section">
<h2>Visit Our Studio</h2>

<!-- PASTE YOUR GOOGLE MAP EMBED LINK BELOW -->
<iframe 
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d124407.87046798339!2d77.50231285696493!3d12.988094102487995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae14d1d2e104a3%3A0x192e88d569db66b8!2sJee%20Digital%20Images%20Studio!5e0!3m2!1sen!2sin!4v1771085479685!5m2!1sen!2sin" 
width="600"
 height="450"
 style="border:0;"
 allowfullscreen="" 
loading="lazy">
</iframe>

</section>

<section class="contact">
<h2>Contact Us</h2>
<p>📞 +91 9448669077 / 7624878142</p>
<p>📧 jeeimagestudio@gmail.com</p>
</section>

<a class="whatsapp" href="https://wa.me/919448669077" target="_blank">💬</a>

<script>
let rating = 0;
let stars = document.querySelectorAll(".star");
let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

function rate(num){
rating = num;
stars.forEach((star,index)=>{
star.classList.toggle("selected", index < num);
});
}

function submitReview(){
let name = document.getElementById("name").value;
let comment = document.getElementById("comment").value;

if(!name || !comment || rating==0){
alert("Please fill all fields and select rating");
return;
}

reviews.push({name,comment,rating});
localStorage.setItem("reviews",JSON.stringify(reviews));

displayReviews();

document.getElementById("name").value="";
document.getElementById("comment").value="";
rating=0;
stars.forEach(s=>s.classList.remove("selected"));
}

function displayReviews(){
let container=document.getElementById("reviews");
container.innerHTML="";
reviews.forEach(r=>{
container.innerHTML+=`
<div class="review-card">
<strong>${r.name}</strong><br>
${"⭐".repeat(r.rating)}
<p>${r.comment}</p>
</div>`;
});
}

displayReviews();
</script>

</body>
</html>
